version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: success_directory
      POSTGRES_USER: sd_user
      POSTGRES_PASSWORD: sd_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sd_user -d success_directory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
