name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src scripts tests
      - name: Run tests (keyless subset; LLM-dependent tests skip)
        run: uv run pytest tests -q
      # No .env and no secrets in CI, so this is exactly a bring-your-own-key
      # deployment: the app must still boot and report that a key is required.
      # Loads via the same module:variable Vercel uses (tool.vercel.entrypoint).
      - name: Deployment entrypoint boots with no credentials configured
        run: |
          uv run python - <<'PY'
          import tomllib
          from fastapi.testclient import TestClient

          with open("pyproject.toml", "rb") as fh:
              entrypoint = tomllib.load(fh)["tool"]["vercel"]["entrypoint"]
          module, _, attr = entrypoint.partition(":")
          app = getattr(__import__(module, fromlist=[attr]), attr)

          with TestClient(app) as c:
              body = c.get("/health").json()
          assert body["status"] == "ok", body
          assert body["byo_key_required"] is True, body
          print(f"BYO-only boot OK via {entrypoint}:", body)
          PY

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build web app
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
